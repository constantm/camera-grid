<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cameras">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <title>Cameras</title>
    <style>
        * { margin: 0; padding: 0; -webkit-box-sizing: border-box; box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .cell {
            position: absolute;
            background: #111;
            -webkit-border-radius: 4px;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* portrait: 2 cols x 3 rows */
        .cell:nth-child(1) { top: 1px;         left: 1px;        width: calc(50% - 2px); height: calc(33.333% - 2px); }
        .cell:nth-child(2) { top: 1px;         left: calc(50% + 1px); width: calc(50% - 2px); height: calc(33.333% - 2px); }
        .cell:nth-child(3) { top: calc(33.333% + 1px); left: 1px;        width: calc(50% - 2px); height: calc(33.333% - 2px); }
        .cell:nth-child(4) { top: calc(33.333% + 1px); left: calc(50% + 1px); width: calc(50% - 2px); height: calc(33.333% - 2px); }
        .cell:nth-child(5) { top: calc(66.666% + 1px); left: 1px;        width: calc(50% - 2px); height: calc(33.333% - 2px); }
        .cell:nth-child(6) { top: calc(66.666% + 1px); left: calc(50% + 1px); width: calc(50% - 2px); height: calc(33.333% - 2px); }

        /* landscape: 3 cols x 2 rows */
        @media (orientation: landscape) {
            .cell:nth-child(1) { top: 1px;         left: 1px;               width: calc(33.333% - 2px); height: calc(50% - 2px); }
            .cell:nth-child(2) { top: 1px;         left: calc(33.333% + 1px); width: calc(33.333% - 2px); height: calc(50% - 2px); }
            .cell:nth-child(3) { top: 1px;         left: calc(66.666% + 1px); width: calc(33.333% - 2px); height: calc(50% - 2px); }
            .cell:nth-child(4) { top: calc(50% + 1px); left: 1px;               width: calc(33.333% - 2px); height: calc(50% - 2px); }
            .cell:nth-child(5) { top: calc(50% + 1px); left: calc(33.333% + 1px); width: calc(33.333% - 2px); height: calc(50% - 2px); }
            .cell:nth-child(6) { top: calc(50% + 1px); left: calc(66.666% + 1px); width: calc(33.333% - 2px); height: calc(50% - 2px); }
        }

        .cell-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 24px;
            height: 24px;
            margin: -12px 0 0 -12px;
            border: 2px solid #333;
            border-top-color: #888;
            -webkit-border-radius: 50%;
            border-radius: 50%;
            -webkit-animation: spin .8s linear infinite;
            animation: spin .8s linear infinite;
            z-index: 1;
        }

        .cell.loaded .cell-spinner { display: none; }

        @-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); transform: rotate(360deg); } }
        @keyframes spin { to { -webkit-transform: rotate(360deg); transform: rotate(360deg); } }

        .cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .cell .label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 4px 8px;
            background: -webkit-linear-gradient(transparent, rgba(0,0,0,.7));
            background: linear-gradient(transparent, rgba(0,0,0,.7));
            color: #fff;
            font: 600 12px/1.4 -apple-system, sans-serif;
            text-transform: capitalize;
            pointer-events: none;
            z-index: 2;
        }

        .cell .dot {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 8px;
            height: 8px;
            -webkit-border-radius: 50%;
            border-radius: 50%;
            background: #4f4;
            z-index: 2;
            opacity: 0;
            -webkit-transition: opacity .3s;
            transition: opacity .3s;
        }

        .cell .dot.on { opacity: 1; }
        .cell .dot.stale { opacity: 1; background: #f44; }

        /* fullscreen overlay */
        #overlay {
            display: none;
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            background: #000;
        }

        #overlay.active { display: block; }

        #overlay .bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 44px;
            padding: 10px 16px;
            background: #111;
            color: #fff;
            font: 600 16px/24px -apple-system, sans-serif;
            text-transform: capitalize;
            z-index: 2;
        }

        #overlay .bar-title {
            float: left;
        }

        #overlay .close {
            float: right;
            font-size: 28px;
            line-height: 24px;
            cursor: pointer;
            padding: 0 8px;
            color: #fff;
            -webkit-tap-highlight-color: transparent;
        }

        #overlay .overlay-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 36px;
            height: 36px;
            margin: -18px 0 0 -18px;
            border: 3px solid #333;
            border-top-color: #888;
            -webkit-border-radius: 50%;
            border-radius: 50%;
            -webkit-animation: spin .8s linear infinite;
            animation: spin .8s linear infinite;
        }

        #overlay .overlay-spinner.hidden { display: none; }

        #overlay img {
            position: absolute;
            top: 44px;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: calc(100% - 44px);
            object-fit: contain;
            background: #000;
        }
    </style>
</head>
<body>
    <div class="grid" id="grid"></div>
    <div id="overlay">
        <div class="bar">
            <span class="bar-title" id="overlay-title"></span>
            <span class="close" id="overlay-close">&times;</span>
        </div>
        <div id="overlay-spinner" class="overlay-spinner"></div>
        <img id="overlay-img" src="" alt="">
    </div>

    <script>
    (function() {
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js");
        }

        var API = "/api";
        var CAMERAS = [
            "driveway", "backyard",
            "eetkamer", "moo_kantoor",
            "anouk_kamer", "heidi_kamer"
        ];
        var REFRESH_MS = 1000;

        function frameWidth() {
            return window.innerWidth > window.innerHeight ? 640 : 480;
        }

        var grid = document.getElementById("grid");
        var overlay = document.getElementById("overlay");
        var overlayTitle = document.getElementById("overlay-title");
        var overlayClose = document.getElementById("overlay-close");
        var overlayImg = document.getElementById("overlay-img");
        var overlaySpinner = document.getElementById("overlay-spinner");

        var activeFullscreen = null;
        var fullscreenRefreshTimer = null;

        var appVisible = true;
        document.addEventListener("visibilitychange", function() {
            appVisible = !document.hidden;
        });

        function buildUrl(name, width) {
            return API + "/frame.jpeg?src=" + encodeURIComponent(name) + "&width=" + width + "&t=" + Date.now();
        }

        for (var i = 0; i < CAMERAS.length; i++) {
            (function(name, index) {
                var cell = document.createElement("div");
                cell.className = "cell";

                var spinner = document.createElement("div");
                spinner.className = "cell-spinner";

                var img = document.createElement("img");
                img.alt = name;
                img.src = buildUrl(name, frameWidth());

                var dot = document.createElement("div");
                dot.className = "dot";

                var label = document.createElement("div");
                label.className = "label";
                label.textContent = name.replace(/_/g, " ");

                cell.appendChild(spinner);
                cell.appendChild(img);
                cell.appendChild(dot);
                cell.appendChild(label);
                grid.appendChild(cell);

                var lastSuccess = Date.now();

                setInterval(function() {
                    if (Date.now() - lastSuccess > 5000) {
                        dot.className = "dot stale";
                    }
                }, 1000);

                function refresh() {
                    if (!appVisible || activeFullscreen === name) {
                        setTimeout(refresh, REFRESH_MS);
                        return;
                    }
                    var next = new Image();
                    next.onload = function() {
                        lastSuccess = Date.now();
                        dot.className = "dot";
                        cell.className = "cell loaded";

                        img.src = next.src;
                        dot.className = "dot on";
                        setTimeout(function() { dot.className = "dot"; }, 300);
                        setTimeout(refresh, REFRESH_MS);
                    };
                    next.onerror = function() {
                        setTimeout(refresh, REFRESH_MS * 3);
                    };
                    next.src = buildUrl(name, frameWidth());
                }
                setTimeout(refresh, index * 150);

                cell.addEventListener("click", function() {
                    openFullscreen(name);
                });
            })(CAMERAS[i], i);
        }

        function refreshFullscreen() {
            if (!activeFullscreen) return;
            var next = new Image();
            next.onload = function() {
                overlaySpinner.className = "overlay-spinner hidden";
                overlayImg.src = next.src;
                fullscreenRefreshTimer = setTimeout(refreshFullscreen, REFRESH_MS);
            };
            next.onerror = function() {
                fullscreenRefreshTimer = setTimeout(refreshFullscreen, REFRESH_MS * 3);
            };
            next.src = buildUrl(activeFullscreen, 1280);
        }

        function openFullscreen(name) {
            activeFullscreen = name;
            overlayTitle.textContent = name.replace(/_/g, " ");
            overlaySpinner.className = "overlay-spinner";
            overlayImg.src = "";
            overlay.className = "active";
            history.pushState({ camera: name }, "");
            refreshFullscreen();
        }

        function closeFullscreen() {
            if (!activeFullscreen) return;
            activeFullscreen = null;
            overlay.className = "";
            overlayImg.src = "";
            if (fullscreenRefreshTimer) {
                clearTimeout(fullscreenRefreshTimer);
                fullscreenRefreshTimer = null;
            }
        }

        window.addEventListener("popstate", function() {
            closeFullscreen();
        });

        overlayClose.addEventListener("click", function(e) {
            e.stopPropagation();
            history.back();
        });

        document.addEventListener("keydown", function(e) {
            if (e.key === "Escape" || e.keyCode === 27) history.back();
        });
    })();
    </script>
</body>
</html>
